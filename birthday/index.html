<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8a0a0;
    --gold: #d4a96a;
    --blush: #f2c4c4;
    --ivory: #fdf6f0;
    --deep-rose: #c26b6b;
    --text-dark: #4a3030;
    --text-mid: #8a6060;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--ivory);
    font-family: 'Noto Serif SC', serif;
    overflow-x: hidden;
    position: relative;
  }

  .bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .bg-canvas::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, #fce4ec88 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, #f8bbd088 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 50%, #fff8f088 0%, transparent 70%);
  }

  .petal {
    position: fixed;
    border-radius: 50% 50% 50% 0;
    opacity: 0; pointer-events: none; z-index: 1;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(0.8); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(720deg) scale(1.1); opacity: 0; }
  }

  .card-wrapper {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%; max-width: 500px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    border: 1.5px solid rgba(232,160,160,0.3);
    box-shadow:
      0 20px 60px rgba(194,107,107,0.12),
      0 4px 20px rgba(232,160,160,0.15),
      inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    animation: cardIn 1.2s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-header { padding: 32px 32px 0; text-align: center; }
  .greeting-small {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 14px; color: var(--gold);
    letter-spacing: 3px; text-transform: uppercase;
    animation: fadeUp 1s 0.4s both;
  }
  .greeting-big {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 8vw, 42px); font-weight: 700;
    color: var(--deep-rose); line-height: 1.15; margin-top: 6px;
    animation: fadeUp 1s 0.6s both;
    text-shadow: 0 2px 20px rgba(194,107,107,0.18);
  }
  .decoration-line {
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rose), var(--gold), var(--rose), transparent);
    margin: 16px auto;
    animation: fadeUp 1s 0.8s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Photo */
  .photo-section { padding: 0 20px; animation: fadeUp 1s 0.9s both; }
  .photo-frame {
    position: relative; width: 100%; aspect-ratio: 3/4;
    border-radius: 20px; overflow: hidden;
    cursor: pointer;
    background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
    box-shadow: 0 8px 30px rgba(194,107,107,0.2), inset 0 0 0 3px rgba(255,255,255,0.6);
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .photo-frame::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 50%, rgba(0,0,0,0.04) 100%);
    z-index: 2; pointer-events: none;
  }
  .photo-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity 0.65s ease, transform 0.65s ease;
    will-change: opacity, transform;
  }
  .photo-img.hidden { opacity: 0; transform: scale(1.04); }
  .photo-img.active { opacity: 1; transform: scale(1); }

  /* fallback gradient shown when image not found */
  .photo-fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: rgba(194,107,107,0.45); font-size: 12px; gap: 8px;
  }
  .photo-fallback .icon { font-size: 48px; opacity: 0.35; }

  .photo-counter {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: rgba(255,255,255,0.78); backdrop-filter: blur(8px);
    border-radius: 12px; padding: 4px 12px;
    font-size: 11px; color: var(--text-mid); letter-spacing: 1px;
    display: none;
  }
  .photo-hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 5;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    border-radius: 20px; padding: 5px 14px;
    font-size: 11px; color: var(--text-mid); white-space: nowrap;
    display: none;
    animation: hintPulse 2.5s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:.65} 50%{opacity:1} }

  /* Message */
  .message-section { padding: 20px 20px; animation: fadeUp 1s 1.1s both; }
  .message-box {
    background: linear-gradient(135deg, rgba(252,228,236,0.5), rgba(248,187,208,0.3));
    border-radius: 18px; padding: 20px 22px;
    border: 1px solid rgba(232,160,160,0.2);
    position: relative; overflow: hidden;
  }
  .message-box::before {
    content: '"'; position: absolute; top: -10px; left: 14px;
    font-family: 'Playfair Display', serif; font-size: 80px;
    color: rgba(232,160,160,0.18); line-height: 1; pointer-events: none;
  }
  .message-name {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 18px; color: var(--deep-rose); margin-bottom: 8px;
  }
  .message-text {
    font-size: 14px; line-height: 1.9; color: var(--text-dark);
    position: relative; z-index: 1;
  }
  .message-sign {
    margin-top: 12px; text-align: right;
    font-size: 13px; color: var(--text-mid); font-style: italic;
  }

  /* 音符浮动指示器（右上角，仅装饰） */
  .music-indicator {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    display: flex; align-items: flex-end; gap: 3px; height: 22px;
    opacity: 0; transition: opacity 0.6s;
  }
  .music-indicator.active { opacity: 1; }
  .bar {
    width: 3px;
    background: linear-gradient(to top, var(--rose), var(--gold));
    border-radius: 2px;
    animation: barBounce 0.8s ease-in-out infinite alternate;
    transform-origin: bottom;
  }
  .bar:nth-child(1){height:8px;  animation-delay:0s}
  .bar:nth-child(2){height:14px; animation-delay:.15s}
  .bar:nth-child(3){height:10px; animation-delay:.3s}
  .bar:nth-child(4){height:18px; animation-delay:.1s}
  .bar:nth-child(5){height:12px; animation-delay:.25s}
  @keyframes barBounce { from{transform:scaleY(0.35)} to{transform:scaleY(1)} }

  .wishes-row { padding: 0 20px 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  .wish-tag {
    font-size: 11px; color: var(--text-mid);
    background: rgba(212,169,106,0.12);
    border: 1px solid rgba(212,169,106,0.25);
    border-radius: 20px; padding: 4px 10px;
  }
  .flowers-bar {
    text-align: center; font-size: 22px;
    padding: 0 0 20px; letter-spacing: 4px;
    animation: fadeUp 1s 1.4s both;
  }

  /* Sparkle */
  .sparkle {
    position: fixed; pointer-events: none; z-index: 200;
    font-size: 18px; animation: sparkleOut 0.75s ease-out forwards;
  }
  @keyframes sparkleOut {
    from { opacity: 1; transform: scale(0) rotate(0deg) translateY(0); }
    to   { opacity: 0; transform: scale(2.2) rotate(40deg) translateY(-28px); }
  }

  @media (max-width: 400px) {
    .card { border-radius: 22px; }
    .card-header { padding: 22px 18px 0; }
    .photo-section, .message-section, .wishes-row { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div id="petalsContainer"></div>

<div class="card-wrapper">
  <div class="card">

    <div class="card-header">
      <div class="greeting-small">✦ Happy Birthday ✦</div>
      <div class="greeting-big" id="friendName">亲爱的小美</div>
      <div class="decoration-line"></div>
    </div>

    <div class="photo-section">
      <div class="photo-frame" id="photoFrame" onclick="nextPhoto(event)">
        <!-- 照片由 JS 按下方 PHOTOS 数组动态插入 -->
        <div class="photo-fallback" id="photoFallback">
          <div class="icon">🌸</div>
          <div>请在 PHOTOS 数组中填写照片文件名</div>
        </div>
        <div class="photo-counter" id="counter"></div>
        <div class="photo-hint" id="clickHint">👆 点击切换下一张</div>
      </div>
    </div>

    <div class="message-section">
      <div class="message-box">
        <div class="message-name" id="displayName">亲爱的小美，</div>
        <div class="message-text" id="msgText">
          在这个特别的日子里，愿所有的美好都悄悄向你涌来。<br>
          生日快乐，愿你永远笑靥如花，岁月温柔以待。🌸
        </div>
        <div class="message-sign" id="msgSign">—— 来自爱你的朋友 ♡</div>
      </div>
    </div>

    <div class="wishes-row">
      <span class="wish-tag">🎂 生日快乐</span>
      <span class="wish-tag">💫 心想事成</span>
      <span class="wish-tag">🌸 美丽永驻</span>
      <span class="wish-tag">✨ 万事顺遂</span>
    </div>

    <div class="flowers-bar">🌸🌷🌼🌺🌻</div>
  </div>
</div>

<!-- 右上角音符动画指示器 -->
<div class="music-indicator" id="musicIndicator">
  <div class="bar"></div><div class="bar"></div>
  <div class="bar"></div><div class="bar"></div>
  <div class="bar"></div>
</div>

<!-- BGM：与 HTML 同目录下的 bgm.mp3 -->
<audio id="bgm" loop src="bgm.mp3"></audio>

<script>
/* ================================================================
   ★ 第一步：把照片和音乐文件放到与此 HTML 相同的目录下
   ★ 第二步：把照片文件名填写到下面的 PHOTOS 数组里（支持任意张数）
   ★ 第三步：背景音乐文件命名为 bgm.mp3 放在同目录

   目录结构示例：
   📁 birthday/
      ├── birthday-card.html   ← 本文件
      ├── bgm.mp3              ← 背景音乐
      ├── photo1.jpg
      ├── photo2.jpg
      └── photo3.jpg
   ================================================================ */
const PHOTOS = [
  'photo1.jpg',
  'photo2.jpg',
  'photo3.jpg',
  'photo4.jpg',
  'photo5.jpg',
  /* 继续添加更多，例如：'photo6.jpg', */
];

/* ================================================================
   ★ 修改贺卡文字内容
   ================================================================ */
const CONFIG = {
  name:    '亲爱的xx',
  message: '在这个特别的日子里，愿所有的美好都悄悄向你涌来。\n生日快乐，愿你永远笑靥如花，岁月温柔以待。🌸',
  sign:    '来自爱你的朋友xx ♡',
};

/* ——— 以下无需修改 ——————————————————————————————————————————— */

// 初始化文字
document.getElementById('friendName').textContent  = CONFIG.name;
document.getElementById('displayName').textContent = CONFIG.name + '，';
document.getElementById('msgText').innerHTML       = CONFIG.message.replace(/\n/g, '<br>');
document.getElementById('msgSign').textContent     = '—— ' + CONFIG.sign;

// ── 照片逻辑 ──────────────────────────────────────────────────
const frame    = document.getElementById('photoFrame');
const counter  = document.getElementById('counter');
const hint     = document.getElementById('clickHint');
const fallback = document.getElementById('photoFallback');

let validEls = [];
let curIdx   = 0;

function buildPhotos() {
  PHOTOS.forEach((src, i) => {
    const img = document.createElement('img');
    img.className = 'photo-img hidden';
    img.alt = '照片 ' + (i + 1);
    img.src = src;

    img.onload = () => {
      validEls.push(img);
      fallback.style.display = 'none';
      if (validEls.length === 1) {
        img.className = 'photo-img active';
        curIdx = 0;
      }
      refreshUI();
    };
    img.onerror = () => { img.style.display = 'none'; };

    frame.insertBefore(img, counter);
  });
}

function refreshUI() {
  const n = validEls.length;
  if (n > 1) {
    counter.style.display = 'block';
    counter.textContent   = (curIdx + 1) + ' / ' + n;
    hint.style.display    = 'block';
  } else {
    counter.style.display = 'none';
    hint.style.display    = 'none';
  }
}

function nextPhoto(e) {
  if (validEls.length < 2) return;
  spawnSparkle(e.clientX, e.clientY);
  validEls[curIdx].className = 'photo-img hidden';
  curIdx = (curIdx + 1) % validEls.length;
  validEls[curIdx].className = 'photo-img active';
  refreshUI();
}

buildPhotos();

// ── 花瓣 ───────────────────────────────────────────────────────
const PETAL_COLORS = ['#f9a8d4','#fca5a5','#fdba74','#d8b4fe','#86efac','#fde68a'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  const c = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
  p.style.cssText = `background:${c};left:${Math.random()*105-2}vw;top:-20px;`
    + `width:${8+Math.random()*10}px;height:${10+Math.random()*12}px;`
    + `animation-duration:${5+Math.random()*8}s;animation-delay:${Math.random()*2}s;`
    + `transform:rotate(${Math.random()*360}deg);`;
  document.getElementById('petalsContainer').appendChild(p);
  setTimeout(() => p.remove(), 13000);
}
setInterval(spawnPetal, 650);
for (let i = 0; i < 10; i++) setTimeout(spawnPetal, i * 180);

// ── 点击闪光 ────────────────────────────────────────────────────
function spawnSparkle(x, y) {
  const EM = ['✨','⭐','🌟','💫','🌸','💕'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = EM[Math.floor(Math.random() * EM.length)];
    s.style.cssText = `left:${x+(-35+Math.random()*70)}px;top:${y+(-35+Math.random()*70)}px;`
      + `animation-delay:${Math.random()*0.18}s`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

// ── 背景音乐自动播放 ─────────────────────────────────────────────
// 文件名：bgm.mp3（与 HTML 同目录）
// 浏览器要求：必须有用户交互后才能播放音频。
// 策略：先尝试直接 autoplay；若被拦截，则在首次点击/触摸时播放。
const bgm       = document.getElementById('bgm');
const indicator = document.getElementById('musicIndicator');

function startBGM() {
  bgm.play().then(() => {
    indicator.classList.add('active');
  }).catch(() => {
    // 浏览器拦截了自动播放，等待用户交互
  });
}

// 尝试立即播放
startBGM();

// 监听任意交互，作为 autoplay 被拦截时的 fallback
function onFirstInteraction() {
  startBGM();
  document.removeEventListener('click',     onFirstInteraction);
  document.removeEventListener('touchstart', onFirstInteraction);
  document.removeEventListener('keydown',   onFirstInteraction);
}
document.addEventListener('click',     onFirstInteraction);
document.addEventListener('touchstart', onFirstInteraction);
document.addEventListener('keydown',   onFirstInteraction);

// 音乐成功播放后显示音符指示器
bgm.addEventListener('play',  () => indicator.classList.add('active'));
bgm.addEventListener('pause', () => indicator.classList.remove('active'));
</script>
</body>
</html>
