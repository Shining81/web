<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8a0a0;
    --gold: #d4a96a;
    --blush: #f2c4c4;
    --ivory: #fdf6f0;
    --deep-rose: #c26b6b;
    --text-dark: #4a3030;
    --text-mid: #8a6060;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--ivory);
    font-family: 'Noto Serif SC', serif;
    overflow-x: hidden;
    position: relative;
  }

  .bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .bg-canvas::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, #fce4ec88 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, #f8bbd088 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 50%, #fff8f088 0%, transparent 70%);
  }

  .petal {
    position: fixed;
    border-radius: 50% 50% 50% 0;
    opacity: 0; pointer-events: none; z-index: 1;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(0.8); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(720deg) scale(1.1); opacity: 0; }
  }

  .card-wrapper {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%; max-width: 500px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    border: 1.5px solid rgba(232,160,160,0.3);
    box-shadow:
      0 20px 60px rgba(194,107,107,0.12),
      0 4px 20px rgba(232,160,160,0.15),
      inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    animation: cardIn 1.2s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-header { padding: 32px 32px 0; text-align: center; }
  .greeting-small {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 14px; color: var(--gold);
    letter-spacing: 3px; text-transform: uppercase;
    animation: fadeUp 1s 0.4s both;
  }
  .greeting-big {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 8vw, 42px); font-weight: 700;
    color: var(--deep-rose); line-height: 1.15; margin-top: 6px;
    animation: fadeUp 1s 0.6s both;
    text-shadow: 0 2px 20px rgba(194,107,107,0.18);
  }
  .decoration-line {
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rose), var(--gold), var(--rose), transparent);
    margin: 16px auto;
    animation: fadeUp 1s 0.8s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Photo */
  .photo-section { padding: 0 28px; animation: fadeUp 1s 0.9s both; }
  .photo-frame {
    position: relative; width: 100%; aspect-ratio: 4/3;
    border-radius: 20px; overflow: hidden;
    cursor: pointer;
    background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
    box-shadow: 0 8px 30px rgba(194,107,107,0.2), inset 0 0 0 3px rgba(255,255,255,0.6);
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .photo-frame::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 50%, rgba(0,0,0,0.04) 100%);
    z-index: 2; pointer-events: none;
  }
  .photo-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity 0.65s ease, transform 0.65s ease;
    will-change: opacity, transform;
  }
  .photo-img.hidden { opacity: 0; transform: scale(1.04); }
  .photo-img.active { opacity: 1; transform: scale(1); }

  /* fallback gradient shown when image not found */
  .photo-fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: rgba(194,107,107,0.45); font-size: 12px; gap: 8px;
  }
  .photo-fallback .icon { font-size: 48px; opacity: 0.35; }

  .photo-counter {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: rgba(255,255,255,0.78); backdrop-filter: blur(8px);
    border-radius: 12px; padding: 4px 12px;
    font-size: 11px; color: var(--text-mid); letter-spacing: 1px;
    display: none;
  }
  .photo-hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 5;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    border-radius: 20px; padding: 5px 14px;
    font-size: 11px; color: var(--text-mid); white-space: nowrap;
    display: none;
    animation: hintPulse 2.5s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:.65} 50%{opacity:1} }

  /* Message */
  .message-section { padding: 20px 28px; animation: fadeUp 1s 1.1s both; }
  .message-box {
    background: linear-gradient(135deg, rgba(252,228,236,0.5), rgba(248,187,208,0.3));
    border-radius: 18px; padding: 20px 22px;
    border: 1px solid rgba(232,160,160,0.2);
    position: relative; overflow: hidden;
  }
  .message-box::before {
    content: '"'; position: absolute; top: -10px; left: 14px;
    font-family: 'Playfair Display', serif; font-size: 80px;
    color: rgba(232,160,160,0.18); line-height: 1; pointer-events: none;
  }
  .message-name {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 18px; color: var(--deep-rose); margin-bottom: 8px;
  }
  .message-text {
    font-size: 14px; line-height: 1.9; color: var(--text-dark);
    position: relative; z-index: 1;
  }
  .message-sign {
    margin-top: 12px; text-align: right;
    font-size: 13px; color: var(--text-mid); font-style: italic;
  }

  /* Music */
  .music-section {
    padding: 0 28px 28px;
    display: flex; align-items: center; justify-content: space-between;
    animation: fadeUp 1s 1.3s both;
  }
  .music-btn {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--rose), var(--blush));
    border: none; border-radius: 50px; padding: 10px 20px;
    color: white; font-size: 13px;
    font-family: 'Noto Serif SC', serif; cursor: pointer;
    box-shadow: 0 4px 16px rgba(194,107,107,0.3);
    transition: all 0.3s ease; -webkit-tap-highlight-color: transparent;
  }
  .music-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(194,107,107,0.4); }
  .music-btn:active { transform: scale(0.97); }
  .music-btn.playing { background: linear-gradient(135deg, var(--deep-rose), var(--rose)); }
  .music-icon { font-size: 16px; display: inline-block; }
  .music-icon.spin { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .note-bars {
    display: flex; align-items: flex-end; gap: 3px;
    height: 20px; opacity: 0; transition: opacity 0.4s;
  }
  .note-bars.active { opacity: 1; }
  .bar {
    width: 3px;
    background: linear-gradient(to top, var(--rose), var(--gold));
    border-radius: 2px;
    animation: barBounce 0.8s ease-in-out infinite alternate;
    transform-origin: bottom;
  }
  .bar:nth-child(1){height:8px;  animation-delay:0s}
  .bar:nth-child(2){height:14px; animation-delay:.15s}
  .bar:nth-child(3){height:10px; animation-delay:.3s}
  .bar:nth-child(4){height:18px; animation-delay:.1s}
  .bar:nth-child(5){height:12px; animation-delay:.25s}
  @keyframes barBounce { from{transform:scaleY(0.35)} to{transform:scaleY(1)} }

  .wishes-row { padding: 0 28px 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  .wish-tag {
    font-size: 11px; color: var(--text-mid);
    background: rgba(212,169,106,0.12);
    border: 1px solid rgba(212,169,106,0.25);
    border-radius: 20px; padding: 4px 10px;
  }
  .flowers-bar {
    text-align: center; font-size: 22px;
    padding: 0 0 20px; letter-spacing: 4px;
    animation: fadeUp 1s 1.4s both;
  }

  /* Sparkle */
  .sparkle {
    position: fixed; pointer-events: none; z-index: 200;
    font-size: 18px; animation: sparkleOut 0.75s ease-out forwards;
  }
  @keyframes sparkleOut {
    from { opacity: 1; transform: scale(0) rotate(0deg) translateY(0); }
    to   { opacity: 0; transform: scale(2.2) rotate(40deg) translateY(-28px); }
  }

  /* Edit FAB */
  .edit-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 50;
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #e8c484);
    border: none; color: white; font-size: 18px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(212,169,106,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .edit-fab:hover { transform: scale(1.1) rotate(15deg); }

  .edit-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .edit-overlay.show { opacity: 1; pointer-events: all; }
  .edit-panel {
    background: white; border-radius: 24px; padding: 28px;
    width: 100%; max-width: 400px;
    transform: scale(0.92); transition: transform 0.3s;
  }
  .edit-overlay.show .edit-panel { transform: scale(1); }
  .edit-panel h3 { font-family:'Playfair Display',serif; color:var(--deep-rose); margin-bottom:16px; font-size:18px; }
  .edit-panel label { display:block; font-size:12px; color:var(--text-mid); margin-bottom:4px; margin-top:12px; }
  .edit-panel input, .edit-panel textarea {
    width:100%; border:1.5px solid rgba(232,160,160,0.4); border-radius:10px;
    padding:10px 14px; font-family:'Noto Serif SC',serif;
    font-size:13px; color:var(--text-dark); outline:none; transition:border-color 0.2s;
  }
  .edit-panel input:focus, .edit-panel textarea:focus { border-color:var(--rose); }
  .edit-panel textarea { height:90px; resize:none; }
  .btn-row { display:flex; gap:10px; margin-top:18px; }
  .btn-save {
    flex:1; background:linear-gradient(135deg,var(--rose),var(--blush));
    color:white; border:none; border-radius:10px; padding:12px;
    font-family:'Noto Serif SC',serif; font-size:13px; cursor:pointer; transition:all 0.2s;
  }
  .btn-save:hover { transform:translateY(-1px); }
  .btn-cancel {
    flex:1; background:rgba(0,0,0,0.06); color:var(--text-mid);
    border:none; border-radius:10px; padding:12px;
    font-family:'Noto Serif SC',serif; font-size:13px; cursor:pointer;
  }

  @media (max-width: 400px) {
    .card { border-radius: 22px; }
    .card-header { padding: 22px 18px 0; }
    .photo-section, .message-section, .music-section, .wishes-row { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div id="petalsContainer"></div>

<div class="card-wrapper">
  <div class="card">

    <div class="card-header">
      <div class="greeting-small">✦ Happy Birthday ✦</div>
      <div class="greeting-big" id="friendName">亲爱的小美</div>
      <div class="decoration-line"></div>
    </div>

    <div class="photo-section">
      <div class="photo-frame" id="photoFrame" onclick="nextPhoto(event)">
        <!-- 照片由 JS 按下方 PHOTOS 数组动态插入 -->
        <div class="photo-fallback" id="photoFallback">
          <div class="icon">🌸</div>
          <div>请在 PHOTOS 数组中填写照片文件名</div>
        </div>
        <div class="photo-counter" id="counter"></div>
        <div class="photo-hint" id="clickHint">👆 点击切换下一张</div>
      </div>
    </div>

    <div class="message-section">
      <div class="message-box">
        <div class="message-name" id="displayName">亲爱的小美，</div>
        <div class="message-text" id="msgText">
          在这个特别的日子里，愿所有的美好都悄悄向你涌来。<br>
          生日快乐，愿你永远笑靥如花，岁月温柔以待。🌸
        </div>
        <div class="message-sign" id="msgSign">—— 来自爱你的朋友 ♡</div>
      </div>
    </div>

    <div class="music-section">
      <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        <span class="music-icon" id="musicIcon">🎵</span>
        <span id="musicLabel">播放生日音乐</span>
      </button>
      <div class="note-bars" id="noteBars">
        <div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="wishes-row">
      <span class="wish-tag">🎂 生日快乐</span>
      <span class="wish-tag">💫 心想事成</span>
      <span class="wish-tag">🌸 美丽永驻</span>
      <span class="wish-tag">✨ 万事顺遂</span>
    </div>

    <div class="flowers-bar">🌸🌷🌼🌺🌻</div>
  </div>
</div>

<button class="edit-fab" onclick="openEdit()" title="编辑贺卡内容">✏️</button>

<div class="edit-overlay" id="editOverlay">
  <div class="edit-panel">
    <h3>✦ 编辑贺卡内容</h3>
    <label>朋友的名字</label>
    <input type="text" id="editName" placeholder="例如：小美" maxlength="20">
    <label>祝福寄语</label>
    <textarea id="editMsg" placeholder="写下你的祝福..."></textarea>
    <label>落款署名</label>
    <input type="text" id="editSign" placeholder="例如：来自爱你的小花" maxlength="30">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-save" onclick="saveEdit()">💾 保存</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   ★ 第一步：把照片文件放到与此 HTML 相同的目录下
   ★ 第二步：把文件名填写到下面的 PHOTOS 数组里（支持任意张数）
   ★ 支持 jpg / jpeg / png / webp / gif 等常见格式

   目录结构示例：
   📁 birthday/
      ├── birthday-card.html   ← 本文件
      ├── photo1.jpg
      ├── photo2.jpg
      └── photo3.png
   ================================================================ */
const PHOTOS = [
  'photo1.jpg',
  'photo2.jpg',
  'photo3.jpg',
  'photo4.jpg',
  'photo5.jpg',
  /* 继续添加更多，例如：'photo6.jpg', */
];

/* ================================================================
   ★ 修改贺卡文字内容（也可点击右下角 ✏️ 按钮在页面上实时修改）
   ================================================================ */
const CONFIG = {
  name:    '亲爱的xx',
  message: '在这个特别的日子里，愿所有的美好都悄悄向你涌来。\n生日快乐，愿你永远笑靥如花，岁月温柔以待。🌸',
  sign:    '来自爱你的朋友 xxx♡',
};

/* ——— 以下无需修改 ——————————————————————————————————————————— */

// 初始化文字
document.getElementById('friendName').textContent  = CONFIG.name;
document.getElementById('displayName').textContent = CONFIG.name + '，';
document.getElementById('msgText').innerHTML       = CONFIG.message.replace(/\n/g, '<br>');
document.getElementById('msgSign').textContent     = '—— ' + CONFIG.sign;

// ── 照片逻辑 ──────────────────────────────────────────────────
const frame    = document.getElementById('photoFrame');
const counter  = document.getElementById('counter');
const hint     = document.getElementById('clickHint');
const fallback = document.getElementById('photoFallback');

let imgEls   = [];   // 全部 img 元素（含未加载完的）
let validEls = [];   // 加载成功的 img 元素
let curIdx   = 0;

function buildPhotos() {
  PHOTOS.forEach((src, i) => {
    const img = document.createElement('img');
    img.className = 'photo-img hidden';
    img.alt = '照片 ' + (i + 1);
    img.src = src;                       // 相对路径，与 HTML 同目录

    img.onload = () => {
      validEls.push(img);
      fallback.style.display = 'none';
      // 让第一张成功加载的照片显示
      if (validEls.length === 1) {
        img.className = 'photo-img active';
        curIdx = 0;
      }
      refreshUI();
    };

    img.onerror = () => {
      // 文件不存在则隐藏该元素，不影响其他图片
      img.style.display = 'none';
    };

    frame.insertBefore(img, counter);   // 插到 counter 前面
    imgEls.push(img);
  });
}

function refreshUI() {
  const n = validEls.length;
  if (n > 1) {
    counter.style.display = 'block';
    counter.textContent   = (curIdx + 1) + ' / ' + n;
    hint.style.display    = 'block';
  } else {
    counter.style.display = 'none';
    hint.style.display    = 'none';
  }
}

function nextPhoto(e) {
  if (validEls.length < 2) return;
  spawnSparkle(e.clientX, e.clientY);
  validEls[curIdx].className = 'photo-img hidden';
  curIdx = (curIdx + 1) % validEls.length;
  validEls[curIdx].className = 'photo-img active';
  refreshUI();
}

buildPhotos();

// ── 花瓣 ───────────────────────────────────────────────────────
const PETAL_COLORS = ['#f9a8d4','#fca5a5','#fdba74','#d8b4fe','#86efac','#fde68a'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  const c = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
  p.style.cssText = `background:${c};left:${Math.random()*105-2}vw;top:-20px;`
    + `width:${8+Math.random()*10}px;height:${10+Math.random()*12}px;`
    + `animation-duration:${5+Math.random()*8}s;animation-delay:${Math.random()*2}s;`
    + `transform:rotate(${Math.random()*360}deg);`;
  document.getElementById('petalsContainer').appendChild(p);
  setTimeout(() => p.remove(), 13000);
}
setInterval(spawnPetal, 650);
for (let i = 0; i < 10; i++) setTimeout(spawnPetal, i * 180);

// ── 点击闪光 ────────────────────────────────────────────────────
function spawnSparkle(x, y) {
  const EM = ['✨','⭐','🌟','💫','🌸','💕'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = EM[Math.floor(Math.random() * EM.length)];
    s.style.cssText = `left:${x+(-35+Math.random()*70)}px;top:${y+(-35+Math.random()*70)}px;`
      + `animation-delay:${Math.random()*0.18}s`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

// ── 音乐（Web Audio 合成生日快乐歌，无版权问题）─────────────────
let playing  = false;
let audioCtx = null;
let loopTimer= null;

// [频率 Hz, 时值拍]
const NOTES = [
  [261.6,.25],[261.6,.25],[293.7,.5],[261.6,.5],[349.2,.5],[329.6,1],
  [261.6,.25],[261.6,.25],[293.7,.5],[261.6,.5],[392.0,.5],[349.2,1],
  [261.6,.25],[261.6,.25],[523.3,.5],[440.0,.5],[349.2,.5],[329.6,.5],[293.7,1],
  [466.2,.25],[466.2,.25],[440.0,.5],[349.2,.5],[392.0,.5],[349.2,1.5],
];
const TEMPO = 0.52;

function playNotes() {
  if (!audioCtx) return;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
  gain.connect(audioCtx.destination);

  let t = audioCtx.currentTime + 0.05;
  let totalDur = 0;
  NOTES.forEach(([freq, dur]) => {
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.28, t + 0.025);
    env.gain.setValueAtTime(0.28, t + dur*TEMPO - 0.06);
    env.gain.linearRampToValueAtTime(0, t + dur*TEMPO);
    osc.connect(env); env.connect(gain);
    osc.start(t); osc.stop(t + dur*TEMPO);
    t += dur*TEMPO; totalDur += dur*TEMPO;
  });
  loopTimer = setTimeout(() => { if (playing) playNotes(); }, (totalDur + 0.9) * 1000);
}

function toggleMusic() {
  playing = !playing;
  const btn   = document.getElementById('musicBtn');
  const icon  = document.getElementById('musicIcon');
  const label = document.getElementById('musicLabel');
  const bars  = document.getElementById('noteBars');
  if (playing) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playNotes();
    btn.classList.add('playing');
    icon.textContent = '🎶'; icon.classList.add('spin');
    label.textContent = '暂停音乐'; bars.classList.add('active');
  } else {
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    btn.classList.remove('playing');
    icon.textContent = '🎵'; icon.classList.remove('spin');
    label.textContent = '播放生日音乐'; bars.classList.remove('active');
  }
}

// ── 编辑面板 ─────────────────────────────────────────────────────
function openEdit() {
  document.getElementById('editName').value = document.getElementById('friendName').textContent;
  document.getElementById('editMsg').value  = document.getElementById('msgText').innerText;
  document.getElementById('editSign').value = document.getElementById('msgSign').textContent.replace(/^—— /,'');
  document.getElementById('editOverlay').classList.add('show');
}
function closeEdit() { document.getElementById('editOverlay').classList.remove('show'); }
function saveEdit() {
  const name = document.getElementById('editName').value.trim() || '亲爱的朋友';
  const msg  = document.getElementById('editMsg').value.trim();
  const sign = document.getElementById('editSign').value.trim();
  document.getElementById('friendName').textContent  = name;
  document.getElementById('displayName').textContent = name + '，';
  document.getElementById('msgText').innerHTML = msg.replace(/\n/g,'<br>');
  if (sign) document.getElementById('msgSign').textContent = '—— ' + sign;
  closeEdit();
}
document.getElementById('editOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});
</script>
